name: Publish

# Trusted Publishing over OIDC, the same shape as dsh-global-todo: no npm token lives in this
# repository. npm requires the package to exist before a trusted publisher can be registered,
# so the very first release is published by hand; every release after it comes from here.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.repository == 'LUgABeEEE/dsh-mnemon-source-global-todo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.19.0'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # Trusted publishing needs npm 11.5.1 or later; Node 22.19 ships npm 10.9.3.
      - name: Install an npm that speaks OIDC
        run: npm install --global npm@^11.5.1
      # The tests need the memory plugin's public SDK for their imports. It is a peer dependency,
      # so CI installs it without touching the package's own dependency list.
      - name: Peer for the tests
        run: npm install --no-save dsh-mnemon@^0.5.34
      - name: Verify
        run: npm test
      # A tag whose version is already on the registry is not an error: it is how a tag gets
      # created after a manual first publish, and how a re-run after a partial failure stays
      # green instead of failing with "cannot publish over the previously published version".
      - name: Is this version already published?
        id: presence
        run: |
          version="$(node -p 'require("./package.json").version')"
          if npm view "dsh-mnemon-source-global-todo@$version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$version is already on the registry; nothing to publish."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$version is not on the registry yet; publishing."
          fi
      - name: Publish with provenance
        if: steps.presence.outputs.published == 'false'
        run: npm publish --provenance --access public
